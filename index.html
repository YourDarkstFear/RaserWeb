<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121214;
      --surface: #1e1f22;
      --surface-high: #28292c;
      --surface-highest: #333438;
      --primary: #d0bcff;
      --on-primary: #381e72;
      --primary-container: #4f378b;
      --on-primary-container: #eaddff;
      --on-surface: #e6e6e8;
      --on-surface-variant: #cac4d0;
      --outline: #938f99;
      --outline-variant: #49454f;
      --accent: var(--primary);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', 'Google Sans Text', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      background-color: var(--bg);
      color: var(--on-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.45s ease, color 0.45s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .top-banner {
      width: 100%;
      height: 40px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--on-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      padding: 0 20px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      transition: background-color 0.2s ease;
    }

    .top-banner:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .top-banner svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.2;
    }

    .hero-glow {
      position: fixed;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(600px, 85vw);
      height: min(500px, 60vh);
      background: var(--accent);
      filter: blur(120px) saturate(2.4);
      opacity: 0.42;
      pointer-events: none !important;
      z-index: 0;
      border-radius: 50%;
      transition: background-color 0.6s ease, opacity 0.6s ease;
      overflow: hidden;
    }

    .main-wrap {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: clamp(6px, 1.2vh, 14px) 16px clamp(12px, 2vh, 20px) 16px;
      gap: clamp(6px, 1.2vh, 14px);
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      overflow: hidden;
    }

    .center-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
    }

    .m3-cover-stage {
      position: relative;
      width: min(72vw, clamp(160px, 40vh, 400px));
      height: min(72vw, clamp(160px, 40vh, 400px));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      transition: transform 0.22s cubic-bezier(0.2, 0, 0, 1), filter 0.22s ease;
    }

    .m3-cover-stage:hover {
      transform: scale(1.025);
      filter: brightness(1.06);
    }

    .m3-cover-stage:active {
      transform: scale(0.975);
    }

    .m3-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .track-meta-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      max-width: 100%;
    }

    .track-title {
      font-size: clamp(20px, 3vh, 32px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--on-surface);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: clamp(14px, 1.8vh, 17px);
      font-weight: 500;
      color: var(--on-surface-variant);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scrubber-row {
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--outline);
      font-variant-numeric: tabular-nums;
      width: 38px;
      user-select: none;
    }

    .sl {
      --v: 0;
      position: relative;
      width: 100%;
      height: 20px;
      flex: 1 1 auto;
    }

    .sl-active,
    .sl-inactive {
      position: absolute;
      top: 4px;
      height: 12px;
      pointer-events: none;
      transition: background-color 0.25s ease;
    }

    .sl-active {
      left: 0;
      width: max(0px, calc((100% - 5px) * var(--v) + 2.5px - 6px));
      background: var(--primary);
      border-radius: 6px 2px 2px 6px;
    }

    .sl-inactive {
      right: 0;
      width: max(0px, calc(100% - ((100% - 5px) * var(--v) + 2.5px) - 6px));
      background: color-mix(in srgb, var(--on-surface) 16%, transparent);
      border-radius: 2px 6px 6px 2px;
    }

    .sl input[type="range"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 20px;
      margin: 0;
      padding: 0;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      z-index: 5;
      touch-action: pan-x;
    }

    .sl input[type="range"]::-webkit-slider-runnable-track {
      height: 20px;
      background: transparent;
    }

    .sl input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 5px;
      height: 20px;
      border-radius: 2.5px;
      background: var(--primary);
      border: none;
      box-shadow: none;
      transform: none;
      transition: width 0.15s ease, background-color 0.25s ease;
    }

    .sl input[type="range"]:active::-webkit-slider-thumb {
      width: 3px;
      transform: none;
    }

    .sl input[type="range"]::-moz-range-track {
      height: 20px;
      background: transparent;
    }

    .sl input[type="range"]::-moz-range-thumb {
      width: 5px;
      height: 20px;
      border-radius: 2.5px;
      background: var(--primary);
      border: none;
      box-shadow: none;
      cursor: pointer;
      transition: width 0.15s ease, background-color 0.25s ease;
    }

    .sl input[type="range"]:active::-moz-range-thumb {
      width: 3px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .btn-play {
      position: relative;
      z-index: 10;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, filter 0.15s ease, background-color 0.3s ease, color 0.3s ease, border-radius 0.2s ease;
    }

    .btn-play.playing {
      border-radius: 18px;
    }

    .btn-play:hover {
      transform: scale(1.06);
      filter: brightness(1.08);
    }

    .btn-play:active {
      transform: scale(0.95);
    }

    .btn-play svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      pointer-events: none !important;
    }

    .btn-spinner {
      width: 22px;
      height: 22px;
      animation: spin 1.2s linear infinite;
      fill: none !important;
      stroke: currentColor;
      stroke-width: 4.5;
      stroke-linecap: round;
    }

    .btn-spinner circle {
      stroke-dasharray: 80, 200;
      stroke-dashoffset: 0;
      animation: dash 1.4s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes dash {
      0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
      50% { stroke-dasharray: 90, 200; stroke-dashoffset: -35px; }
      100% { stroke-dasharray: 90, 200; stroke-dashoffset: -125px; }
    }

    .btn-icon {
      position: relative;
      z-index: 10;
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--surface-high);
      color: var(--on-surface-variant);
      border: none;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    .btn-icon:hover {
      background: var(--surface-highest);
      color: var(--on-surface);
    }

    .btn-icon:active {
      transform: scale(0.94);
    }

    .btn-icon.active {
      background: var(--primary) !important;
      color: var(--on-primary) !important;
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      pointer-events: none !important;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 136px;
      flex-shrink: 0;
    }

    #btnMute {
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
    }

    .hidden-player {
      position: fixed;
      bottom: -100px;
      right: -100px;
      width: 64px;
      height: 64px;
      opacity: 0.001;
      pointer-events: none;
      z-index: -999;
    }

    @media (max-width: 600px) {
      .main-wrap {
        padding: 6px 14px 16px 14px;
        gap: 10px;
        justify-content: space-between;
      }
      .m3-cover-stage {
        width: min(68vw, 30vh);
        height: min(68vw, 30vh);
      }
      .track-title {
        font-size: 20px;
      }
      .track-artist {
        font-size: 13px;
      }
      .scrubber-row {
        gap: 8px;
        max-width: 100%;
        padding: 0 4px;
      }
      .time-label {
        font-size: 11px;
        width: 32px;
      }
      .controls-row {
        width: 100%;
        max-width: 320px;
        justify-content: space-between;
        gap: 8px;
      }
      .volume-group {
        width: auto;
      }
      .volume-group .sl {
        display: none !important;
      }
      .btn-play {
        width: 56px;
        height: 56px;
      }
      .btn-icon {
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
      }
    }

    @media (max-height: 680px) and (max-width: 600px) {
      .top-banner {
        height: 30px;
        font-size: 11px;
      }
      .m3-cover-stage {
        width: min(56vw, 24vh);
        height: min(56vw, 24vh);
      }
      .main-wrap {
        gap: 6px;
        padding-bottom: 12px;
      }
      .btn-play {
        width: 50px;
        height: 50px;
      }
      .btn-icon {
        width: 40px;
        height: 40px;
        min-width: 40px;
        min-height: 40px;
      }
    }
  </style>

    (function () {
      const K = 360;
      const R = 160;
      const TAU = Math.PI * 2;
      const DEG = Math.PI / 180;

      const DEFS = [
        {
          kind: "cookie",
          petals: 7,
          center: [160, 608.78580952],
          stretch: 1.00227424,
          rim: [154.0236, 15.1787],
          handle: [167.8238, 5.6686],
          f1: [[153.2414, 15.8961], [152.2361, 16.7034], [150.3202, 18.3516]],

          rim: [154.3557, 11.7227],
          handle: [165.6694, 4.4348],
          f1: [[153.9368, 12.0547], [153.4294, 12.4257], [152.4353, 13.1735]],
          f2: [[151.9994, 13.5097], [151.7843, 13.6784], [151.5812, 13.8451]],
          vh: [147.3456, 17.7843]
        },
        {
          kind: "cookie",
          petals: 12,
          center: [1974, 604.001],
          stretch: 1,
          rim: [152.8016, 8.376],
          handle: [163.2344, 3.4256],
          f1: [[152.6152, 8.4738], [152.3933, 8.5891], [151.9524, 8.8207]],
          f2: [[151.6913, 8.9609], [151.5576, 9.0305], [151.4338, 9.0971]],
          vh: [145.4447, 12.6887]
        },
        {
          kind: "clover",
          center: [1066.99925, 604.003],
          os: [38.73, -133.7908],
          oh: [98.8705, -159.911],
          is: [129.471, -28.79],
          ih: [121.4998, -10.42]
        }
      ];

      function bezPt(c, t) {
        const u = 1 - t;
        const a = u * u * u;
        const b = 3 * u * u * t;
        const d = 3 * u * t * t;
        const e = t * t * t;
        return [
          a * c[0][0] + b * c[1][0] + d * c[2][0] + e * c[3][0],
          a * c[0][1] + b * c[1][1] + d * c[2][1] + e * c[3][1]
        ];
      }

      function segLine(a, b) {
        const dx = (b[0] - a[0]) / 3;
        const dy = (b[1] - a[1]) / 3;
        return [a, [a[0] + dx, a[1] + dy], [a[0] + 2 * dx, a[1] + 2 * dy], b];
      }

      function polar(c, st, r, ang) {
        return [c[0] + r * Math.cos(ang), c[1] + st * r * Math.sin(ang)];
      }

      function wrapAng(d) {
        let r = d % TAU;
        if (r > Math.PI) r -= TAU;
        if (r <= -Math.PI) r += TAU;
        return r;
      }

      function mkCookie(d) {
        const step = TAU / d.petals;
        const out = [];
        for (let i = 0; i < d.petals; i++) {
          const base = -Math.PI / 2 + i * step;
          const p = (pt) => polar(d.center, d.stretch, pt[0], base + pt[1] * DEG);
          const pm = (pt) => polar(d.center, d.stretch, pt[0], base + step - pt[1] * DEG);
          const pl = (pt) => p([pt[0], -pt[1]]);
          const e1 = d.f1[2];
          const e2 = d.f2[2];
          out.push([pl(d.rim), pl(d.handle), p(d.handle), p(d.rim)]);
          out.push([p(d.rim), p(d.f1[0]), p(d.f1[1]), p(e1)]);
          out.push([p(e1), p(d.f2[0]), p(d.f2[1]), p(e2)]);
          out.push([p(e2), p(d.vh), pm(d.vh), pm(e2)]);
          out.push([pm(e2), pm(d.f2[1]), pm(d.f2[0]), pm(e1)]);
          out.push([pm(e1), pm(d.f1[1]), pm(d.f1[0]), pm(d.rim)]);
        }
        return out;
      }

      function mkClover(d) {
        const out = [];
        const rotQ = (pt, q) => {
          let x = pt[0], y = pt[1];
          for (let s = 0; s < q; s++) { const tx = -y; y = x; x = tx; }
          return [d.center[0] + x, d.center[1] + y];
        };
        for (let q = 0; q < 4; q++) {
          const p = (pt) => rotQ(pt, q);
          const oa = [p(d.os), p(d.oh), p([-d.oh[1], -d.oh[0]]), p([-d.os[1], -d.os[0]])];
          const ia = [p(d.is), p(d.ih), p([d.ih[0], -d.ih[1]]), p([d.is[0], -d.is[1]])];
          const next = rotQ(d.os, q + 1);
          out.push(oa, segLine(oa[3], ia[0]), ia, segLine(ia[3], next));
        }
        return out;
      }

      function curveBbox(c) {
        const b = [Infinity, Infinity, -Infinity, -Infinity];
        const add = (p) => {
          b[0] = Math.min(b[0], p[0]); b[1] = Math.min(b[1], p[1]);
          b[2] = Math.max(b[2], p[0]); b[3] = Math.max(b[3], p[1]);
        };
        add(c[0]); add(c[3]);
        for (let ax = 0; ax < 2; ax++) {
          const d1 = c[1][ax] - c[0][ax];
          const d2 = c[2][ax] - c[1][ax];
          const d3 = c[3][ax] - c[2][ax];
          const A = d1 - 2 * d2 + d3;
          const B = 2 * (d2 - d1);
          const C = d1;
          const roots = [];
          if (Math.abs(A) < 1e-12) {
            if (Math.abs(B) > 1e-12) roots.push(-C / B);
          } else {
            const disc = B * B - 4 * A * C;
            if (disc >= 0) {
              const sq = Math.sqrt(disc);
              roots.push((-B + sq) / (2 * A), (-B - sq) / (2 * A));
            }
          }
          roots.forEach((t) => { if (t > 0 && t < 1) add(bezPt(c, t)); });
        }
        return b;
      }

      function getCenter(out) {
        const tot = [Infinity, Infinity, -Infinity, -Infinity];
        out.forEach((c) => {
          const b = curveBbox(c);
          tot[0] = Math.min(tot[0], b[0]); tot[1] = Math.min(tot[1], b[1]);
          tot[2] = Math.max(tot[2], b[2]); tot[3] = Math.max(tot[3], b[3]);
        });
        return [(tot[0] + tot[2]) / 2, (tot[1] + tot[3]) / 2];
      }

      function angTo(pt, c) {
        return Math.atan2(pt[1] - c[1], pt[0] - c[0]);
      }

      function mkSects(out, c) {
        const res = [];
        let a = angTo(out[0][0], c);
        out.forEach((curve) => {
          const s = a;
          const e = s + wrapAng(angTo(curve[3], c) - s);
          res.push({ curve, s, e });
          a = e;
        });
        return res;
      }

      function sampleRad(sects, c, ang) {
        const a0 = sects[0].s;
        const tgt = a0 + ((((ang - a0) % TAU) + TAU) % TAU);
        let sec = sects[sects.length - 1];
        for (let i = 0; i < sects.length; i++) {
          if (tgt >= sects[i].s && tgt <= sects[i].e) { sec = sects[i]; break; }
        }
        let lo = 0, hi = 1;
        for (let i = 0; i < 56; i++) {
          const mid = (lo + hi) / 2;
          const pt = bezPt(sec.curve, mid);
          const pa = sec.s + wrapAng(angTo(pt, c) - sec.s);
          if (pa < tgt) lo = mid; else hi = mid;
        }
        const pt = bezPt(sec.curve, (lo + hi) / 2);
        return Math.hypot(pt[0] - c[0], pt[1] - c[1]);
      }

      function buildProf(d) {
        const out = d.kind === "clover" ? mkClover(d) : mkCookie(d);
        const c = getCenter(out);
        let sects = mkSects(out, c);
        if (sects[sects.length - 1].e - sects[0].s < 0) {
          sects = mkSects(out.slice().reverse().map((cv) => cv.slice().reverse()), c);
        }
        const rads = new Float32Array(K);
        let maxR = 0;
        for (let i = 0; i < K; i++) {
          const a = -Math.PI + (TAU * i) / K;
          rads[i] = sampleRad(sects, c, a);
          if (rads[i] > maxR) maxR = rads[i];
        }
        const sc = R / maxR;
        for (let i = 0; i < K; i++) rads[i] *= sc;
        return rads;
      }

      const profs = DEFS.map(buildProf);
      const hist = [0];

      function nextShape(cur) {
        if (cur !== undefined && hist[hist.length - 1] !== cur) hist.push(cur);
        const rec = hist.slice(-2);
        const opts = profs.map((_, i) => i).filter((i) => !rec.includes(i));
        const pick = opts.length ? opts[Math.floor(Math.random() * opts.length)] : 0;
        hist.push(pick);
        if (hist.length > 10) hist.shift();
        return pick;
      }

      window.RiffShapes = {
        K,
        HOLD_MS: 2400,
        MORPH_MS: 1300,
        ease: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
        ready: () => profs.length > 0,
        profile: (i) => profs[i],
        next: nextShape
      };
    })();

    function drawCookie8(ctx, cx, cy, r) {
      const n = 8;
      const step = (Math.PI * 2) / n;
      const ro = r;
      const ri = r * 0.82;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a0 = i * step - Math.PI / 2;
        const aMid = a0 + step * 0.5;
        const aNext = a0 + step;
        const cp1x = cx + ro * 1.06 * Math.cos(a0 + step * 0.2);
        const cp1y = cy + ro * 1.06 * Math.sin(a0 + step * 0.2);
        const mx = cx + ro * Math.cos(aMid);
        const my = cy + ro * Math.sin(aMid);
        const cp2x = cx + ro * 1.06 * Math.cos(a0 + step * 0.8);
        const cp2y = cy + ro * 1.06 * Math.sin(a0 + step * 0.8);
        const ex = cx + ri * Math.cos(aNext);
        const ey = cy + ri * Math.sin(aNext);
        if (i === 0) ctx.moveTo(cx + ri * Math.cos(a0), cy + ri * Math.sin(a0));
        ctx.quadraticCurveTo(cp1x, cp1y, mx, my);
        ctx.quadraticCurveTo(cp2x, cp2y, ex, ey);
      }
      ctx.closePath();
    }

    function genOg(imgUrl) {
      if (!imgUrl) return;
      const proxy = `https://wsrv.nl/?url=${encodeURIComponent(imgUrl)}&w=800&h=800&fit=cover&output=jpg`;
      const baseImg = new Image();

        drawCookie8(octx, cx, cy, cr);
        octx.fill();
        octx.restore();

        const logo = new Image();
        logo.crossOrigin = 'Anonymous';
        logo.onload = () => {

          octx.drawImage(ic, cx - isz / 2, cy - isz / 2);

          try {

            if (tw) tw.content = dataUrl;

    function toHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      let h = 0, s = 0, l = (mx + mn) / 2;
      if (mx !== mn) {
        const d = mx - mn;
        s = l > 0.5 ? d / (2 - mx - mn) : d / (max + min);
        if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (mx === g) h = ((b - r) / d + 2) / 6;
        else h = ((r - g) / d + 4) / 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }

    function setTheme(h, s) {
      const k = Math.min(1, Math.max(0, s / 85));
      const pSat = Math.round(18 + k * 74);
      const bgSat = Math.round(k * 36);

      const pri = `hsl(${h}, ${pSat}%, 78%)`;
      const onPri = `hsl(${h}, ${Math.min(100, pSat)}%, 16%)`;
      const priCont = `hsl(${h}, ${Math.round(pSat * 0.75)}%, 30%)`;
      const onPriCont = `hsl(${h}, ${pSat}%, 92%)`;
      const bg = `hsl(${h}, ${bgSat}%, 8%)`;
      const surf = `hsl(${h}, ${bgSat}%, 12%)`;
      const surfHi = `hsl(${h}, ${bgSat}%, 17%)`;
      const surfMax = `hsl(${h}, ${bgSat}%, 22%)`;
      const onSurf = `hsl(${h}, ${Math.round(bgSat * 0.6)}%, 93%)`;
      const onSurfVar = `hsl(${h}, ${Math.round(bgSat * 0.7)}%, 78%)`;
      const outl = `hsl(${h}, ${Math.round(bgSat * 0.5)}%, 58%)`;

      const st = document.documentElement.style;
      st.setProperty('--primary', pri);
      st.setProperty('--on-primary', onPri);
      st.setProperty('--primary-container', priCont);
      st.setProperty('--on-primary-container', onPriCont);
      st.setProperty('--bg', bg);
      st.setProperty('--surface', surf);
      st.setProperty('--surface-high', surfHi);
      st.setProperty('--surface-highest', surfMax);
      st.setProperty('--on-surface', onSurf);
      st.setProperty('--on-surface-variant', onSurfVar);
      st.setProperty('--outline', outl);
      st.setProperty('--accent', pri);

      heroGlow.style.background = pri;
      heroGlow.style.opacity = String((0.22 + k * 0.28).toFixed(2));
    }

    function getColors(img) {
      const c = document.createElement('canvas');
      c.width = 48;
      c.height = 48;
      const x = c.getContext('2d');
      try {
        x.drawImage(img, 0, 0, 48, 48);
        const px = x.getImageData(0, 0, 48, 48).data;
        const bins = Array.from({ length: 24 }, () => ({ w: 0 }));
        let colored = 0, bestW = 0, bestIdx = -1;

        for (let i = 0; i < px.length; i += 4) {
          if (px[i + 3] < 128) continue;
          const [h, s, l] = toHsl(px[i], px[i + 1], px[i + 2]);
          if (l >= 10 && l <= 90 && s >= 10) {
            colored++;
            const idx = Math.min(23, Math.floor(h / 15));
            const w = (s / 100) * (1 - Math.abs(l - 50) / 55);
            bins[idx].w += Math.max(0.1, w);
            if (bins[idx].w > bestW) {
              bestW = bins[idx].w;
              bestIdx = idx;
            }
          }
        }

        if (bestIdx !== -1 && colored > 20) {
          let hSum = 0, sSum = 0, n = 0;
          for (let i = 0; i < px.length; i += 4) {
            const [h, s, l] = toHsl(px[i], px[i + 1], px[i + 2]);
            if (l >= 10 && l <= 90 && s >= 10 && Math.min(23, Math.floor(h / 15)) === bestIdx) {
              hSum += h; sSum += s; n++;
            }
          }
          setTheme(n ? Math.round(hSum / n) : 270, n ? Math.round(sSum / n) : 70);
          return true;
        }
        setTheme(270, 8);
        return true;
      } catch {
        return false;
      }
    }

    function dec(s) {
      if (!s) return '';
      try { return decodeURIComponent(s.replace(/\+/g, ' ')).trim(); }
      catch { return s.replace(/\+/g, ' ').trim(); }
    }

    function parseUrl() {

          duration: parseInt(pt.dur || pt.duration || '0', 10) || 0

      const q = (window.location.search || window.location.hash || '').replace(/^[?#]/, '');
      const map = new Map();
      for (const part of q.split(/[?&]/)) {
        if (!part) continue;
        const eq = part.indexOf('=');
        if (eq !== -1) map.set(dec(part.slice(0, eq)), dec(part.slice(eq + 1)));
      }

      const title = map.get('n') || '';
      const artist = map.get('a') || '';
      const mediaUrl = map.get('url') || '';
      const streamUrl = map.get('stream') || '';
      const image = map.get('img') || '';
      const duration = parseInt(map.get('dur') || '0', 10);

      if (!title && !artist && !mediaUrl && !streamUrl) {
        window.location.replace('https://github.com/YourDarkstFear/Raser');
        throw new Error('No track parameters specified. Redirecting to Raser.');

      return {
        type,
        title,
        artist,
        streamUrl,
        mediaUrl,
        image,
        duration
      };
    }

    function updBar(sl, wrap) {

    const canvas = document.getElementById('m3CoverCanvas');

    function loadProxy(proxyUrl, rawUrl) {

    function loadCover(url) {

    function initCover() {

    initCover();

    const st = { from: 0, to: 0, start: 0, rot: 0, phase: 0, last: 0 };

    function curShape(now) {
      const S = window.RiffShapes;
      if (!S || !S.ready()) return null;
      if (!st.start) st.start = now;
      if (now - st.start >= S.HOLD_MS) {
        st.from = st.to;
        st.to = S.next(st.from);
        st.start = now;
      }
      const t = Math.min(1, (now - st.start) / S.MORPH_MS);
      return { a: S.profile(st.from), b: S.profile(st.to), e: S.ease(t) };
    }

    function drawLoop(now) {
      const S = window.RiffShapes;
      if (!ctx || !S) return;

      if (!st.last) st.last = now;
      const dt = Math.min(48, Math.max(0, now - st.last));
      st.last = now;

      st.rot = (st.rot + (isPlaying ? 0.00045 : 0.00012) * dt) % (Math.PI * 2);
      if (isPlaying) st.phase += 0.006 * dt;

      const sh = curShape(now);
      if (!sh) return;

      const K = S.K;
      const cx = SZ / 2, cy = SZ / 2;
      const box = 330;
      const sc = (box / 2) / 160;
      const rot = st.rot;

      function radAt(ang) {
        const f = ((ang + Math.PI) / (Math.PI * 2)) * K;
        const i0 = ((Math.floor(f) % K) + K) % K;
        const i1 = (i0 + 1) % K;
        const w = f - Math.floor(f);
        const r0 = sh.a[i0] + (sh.b[i0] - sh.a[i0]) * sh.e;
        const r1 = sh.a[i1] + (sh.b[i1] - sh.a[i1]) * sh.e;
        return (r0 + (r1 - r0) * w) * sc;
      }

      ctx.clearRect(0, 0, SZ, SZ);

      ctx.save();
      ctx.beginPath();
      for (let k = 0; k <= K; k++) {
        const th = -Math.PI + (Math.PI * 2 * (k % K)) / K;
        const r = radAt(th);
        const x = cx + Math.cos(th + rot) * r;
        const y = cy + Math.sin(th + rot) * r;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.clip();

      if (imgOk && coverImg) {
        const iw = coverImg.naturalWidth || 300;
        const ih = coverImg.naturalHeight || 300;
        const side = Math.min(iw, ih);
        const tSide = Math.ceil(box * 1.08);
        ctx.drawImage(coverImg, (iw - side) / 2, (ih - side) / 2, side, side, cx - tSide / 2, cy - tSide / 2, tSide, tSide);
      } else {
        ctx.fillStyle = '#2b2930';
        ctx.fillRect(0, 0, SZ, SZ);
      }
      ctx.restore();

      const dur = parseFloat(seekSlider.max) || 100;
      const pos = parseFloat(seekSlider.value) || 0;
      const prog = dur > 0 ? Math.min(1, Math.max(0, pos / dur)) : 0;
      const col = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#d0bcff';

      const N = 220, gap = 16, lw = 4;
      const ringPt = (phi, wv) => {
        const r = radAt(phi - rot) + gap + lw / 2 + wv;
        return [cx + Math.cos(phi) * r, cy + Math.sin(phi) * r];
      };

      const p0 = -Math.PI / 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = lw;
      ctx.strokeStyle = col;

      ctx.setLineDash([0.1, 7.5]);
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      const sFrom = Math.round(prog * N);
      for (let s = sFrom; s <= N; s++) {
        const [x, y] = ringPt(p0 + (Math.PI * 2 * s) / N, 0);
        if (s === sFrom) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      if (prog > 0) {
        ctx.beginPath();
        const pSteps = Math.max(2, Math.round(prog * N));
        for (let s = 0; s <= pSteps; s++) {
          const phi = p0 + (Math.PI * 2 * s) / N;
          const wv = isPlaying ? Math.sin(phi * 24 + st.phase) * 1.8 : 0;
          const [x, y] = ringPt(phi, wv);
          if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      requestAnimationFrame(drawLoop);
    }

    requestAnimationFrame(drawLoop);

    let isPlaying = false;
    let dragging = false;
    let ytPlayer = null;
    let useYt = false;
    let ytReady = false;

    function isRealYtId(id) {
      if (!id || typeof id !== 'string') return false;
      if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return false;

    }

    function getYtId(u) {

      const m = u.match(/(?:v=|\/embed\/|\/watch\/|youtu\.be\/|\/v\/|^)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : '';
    }

    const rawYtId = getYtId(info.mediaUrl);
    let ytResolvedId = isRealYtId(rawYtId) ? rawYtId : '';

    async function resolveTrackId(artist, title) {
      const q = `${artist || ''} ${title || ''}`.trim();
      if (!q) return null;
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data && data.results && data.results.length > 0) {
          for (const item of data.results) {
            if (isRealYtId(item.id)) return item;
          }
          return data.results[0];
        }
      } catch (_) {}
      return null;
    }

    if (!ytResolvedId && (info.title || info.artist)) {
      resolveTrackId(info.artist, info.title).then(tr => {

    function initYtPlayer() {
      if (ytPlayer) return;
      ytPlayer = new YT.Player('youtubePlayerHost', {
        height: '64',
        width: '64',
        videoId: ytResolvedId || '',
        playerVars: {
          autoplay: 0,
          playsinline: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            ytReady = true;
            if (ytResolvedId) {
              ytPlayer.cueVideoById(ytResolvedId);
            } else {
              resolveTrackId(info.artist, info.title).then(tr => {
                if (tr && tr.id) {
                  ytResolvedId = tr.id;
                  ytPlayer.cueVideoById(ytResolvedId);
                }
              });
            }
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.BUFFERING) {
              setBtn('loading');
            } else if (e.data === YT.PlayerState.PLAYING) {
              setBtn('playing');
              const d = ytPlayer.getDuration();
              if (d > 0) {
                seekSlider.max = Math.round(d);
                durTimeEl.textContent = fmtTime(d);
              }
            } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
              setBtn('paused');
            }
          },
          onError: (e) => {
            console.warn('YouTube error:', e.data, '- auto resolving track');
            resolveTrackId(info.artist, info.title).then(tr => {
              if (tr && tr.id && tr.id !== ytResolvedId) {
                ytResolvedId = tr.id;
                ytPlayer.cueVideoById(ytResolvedId);
                if (isPlaying) ytPlayer.playVideo();
              } else if (tr && tr.streamUrl) {
                useYt = false;
                audio.src = tr.streamUrl;
                if (isPlaying) {
                  audio.play().then(() => setBtn('playing')).catch(() => setBtn('paused'));
                }
              } else {
                setBtn('paused');
              }
            });
          }
        }
      });
    }

    function setBtn(state) {
      if (state === 'loading') {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'none';
        spinIcon.style.display = 'block';
        btnPlay.classList.remove('playing');
        return;
      }
      spinIcon.style.display = 'none';
      if (state === 'playing') {
        isPlaying = true;
        btnPlay.classList.add('playing');
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        isPlaying = false;
        btnPlay.classList.remove('playing');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
      updateMediaSession();
    }

    const isDirectAudio = (u) => typeof u === 'string' && (/\.(mp3|m4a|ogg|wav|aac|flac|opus)(\?.*)?$/i.test(u) || u.includes('/api/library-file') || u.includes('/audio'));
    const directAudioSrc = info.streamUrl || (isDirectAudio(info.mediaUrl) ? info.mediaUrl : '');

    function goYt() {
      if (ytPlayer && ytReady) {
        useYt = true;
        if (ytResolvedId) {
          ytPlayer.playVideo();
        } else {
          resolveTrackId(info.artist, info.title).then(tr => {
            if (tr && tr.id) {
              ytResolvedId = tr.id;
              ytPlayer.loadVideoById(ytResolvedId);
              ytPlayer.playVideo();
            } else {
              setBtn('paused');
            }
          });
        }
      } else {
        setTimeout(startPlay, 300);
      }
    }

    function startPlay() {
      setBtn('loading');
      if (directAudioSrc) {
        useYt = false;
        if (!audio.src) audio.src = directAudioSrc;
        audio.play().then(() => {
          setBtn('playing');
        }).catch((err) => {
          console.warn('Native audio play failed, falling back:', err);
          goYt();
        });
      } else {
        goYt();
      }
    }

    function stopPlay() {
      if (useYt && ytPlayer) ytPlayer.pauseVideo();
      else audio.pause();
      setBtn('paused');
    }

    function togglePlay() {
      if (isPlaying) stopPlay();
      else startPlay();
    }

    function seekTo(t) {
      if (useYt && ytPlayer && ytReady) ytPlayer.seekTo(t, true);
      else audio.currentTime = t;
      seekSlider.value = Math.round(t);
      curTimeEl.textContent = fmtTime(t);
      updBar(seekSlider, seekWrap);
      updateMediaPositionState();
    }

    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    audio.addEventListener('waiting', () => { if (isPlaying) setBtn('loading'); });
    audio.addEventListener('playing', () => setBtn('playing'));
    audio.addEventListener('pause', () => setBtn('paused'));
    audio.addEventListener('ended', () => setBtn('paused'));
    audio.addEventListener('error', () => {
      if (ytId) goYt();
      else setBtn('paused');
    });

    audio.addEventListener('timeupdate', () => {
      if (dragging || useYt) return;
      const c = audio.currentTime;
      const d = audio.duration;
      curTimeEl.textContent = fmtTime(c);
      if (d > 0) {
        seekSlider.value = Math.round(c);
        seekSlider.max = Math.round(d);
        durTimeEl.textContent = fmtTime(d);
      }
      updBar(seekSlider, seekWrap);
      updateMediaPositionState();
    });

    setInterval(() => {
      if (!isPlaying || !useYt || !ytPlayer || dragging) return;
      try {
        const c = ytPlayer.getCurrentTime();
        const d = ytPlayer.getDuration();
        curTimeEl.textContent = fmtTime(c);
        if (d > 0) {
          seekSlider.value = Math.round(c);
          seekSlider.max = Math.round(d);
          durTimeEl.textContent = fmtTime(d);
        }
        updBar(seekSlider, seekWrap);
        updateMediaPositionState();
      } catch {}
    }, 350);

    seekSlider.addEventListener('input', () => {
      dragging = true;
      curTimeEl.textContent = fmtTime(parseFloat(seekSlider.value));
      updBar(seekSlider, seekWrap);
    });

    seekSlider.addEventListener('change', () => {
      dragging = false;
      seekTo(parseFloat(seekSlider.value));
    });

    volSlider.addEventListener('input', () => {
      const v = parseFloat(volSlider.value);
      audio.volume = v;
      if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(Math.round(v * 100));
      updBar(volSlider, volWrap);
    });

    let lastVol = 0.9;
    btnMute.addEventListener('click', (e) => {
      e.stopPropagation();
      if (volSlider.value > 0) {
        lastVol = volSlider.value;
        volSlider.value = 0;
      } else {
        volSlider.value = lastVol;
      }
      volSlider.dispatchEvent(new Event('input'));
    });

    btnCopy.addEventListener('click', async (e) => {
      e.stopPropagation();
      const currentUrl = window.location.href;
      if (currentUrl.includes('/s/')) {
        navigator.clipboard.writeText(currentUrl).then(() => {
          const old = titleEl.textContent;
          titleEl.textContent = 'Link copied!';
          setTimeout(() => { titleEl.textContent = old; }, 1200);
        });
      } else {
        try {
          const res = await fetch('/api/shorten', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              n: info.title,
              a: info.artist,
              url: info.mediaUrl,
              img: info.image,
              dur: info.duration,
              t: info.type,
              stream: info.streamUrl
            })
          });
          const d = await res.json();
          if (d && d.url) {
            navigator.clipboard.writeText(d.url);
            const old = titleEl.textContent;
            titleEl.textContent = 'Short link copied!';
            setTimeout(() => { titleEl.textContent = old; }, 1200);
            return;
          }
        } catch (_) {}
        navigator.clipboard.writeText(currentUrl).then(() => {
          const old = titleEl.textContent;
          titleEl.textContent = 'Link copied!';
          setTimeout(() => { titleEl.textContent = old; }, 1200);
        });
      }
    });

    function updateMediaSession() {
      if (!('mediaSession' in navigator)) return;
      const title = info.title || 'Unknown Title';
      const artist = info.artist || 'Unknown Artist';
      const album = 'Raser';
      const artwork = [];
      if (info.image) {
        artwork.push(
          { src: info.image, sizes: '96x96', type: 'image/jpeg' },
          { src: info.image, sizes: '128x128', type: 'image/jpeg' },
          { src: info.image, sizes: '256x256', type: 'image/jpeg' },
          { src: info.image, sizes: '512x512', type: 'image/jpeg' }
        );
      }
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title,
          artist,
          album,
          artwork
        });
        navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
        updateMediaPositionState();
      } catch (_) {}
    }

    function updateMediaPositionState() {
      if (!('mediaSession' in navigator) || typeof navigator.mediaSession.setPositionState !== 'function') return;
      try {
        const duration = (useYt && ytPlayer && ytReady)
          ? ytPlayer.getDuration()
          : (audio && Number.isFinite(audio.duration) ? audio.duration : parseFloat(seekSlider.max) || 0);
        const position = (useYt && ytPlayer && ytReady)
          ? ytPlayer.getCurrentTime()
          : (audio && Number.isFinite(audio.currentTime) ? audio.currentTime : parseFloat(seekSlider.value) || 0);
        if (duration > 0 && position >= 0 && position <= duration) {
          navigator.mediaSession.setPositionState({
            duration,
            playbackRate: 1.0,
            position
          });
        }
      } catch (_) {}
    }

    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying) startPlay(); });
        navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) stopPlay(); });
        navigator.mediaSession.setActionHandler('stop', () => stopPlay());
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime !== undefined && details.seekTime !== null) {
            seekTo(details.seekTime);
          }
        });
        navigator.mediaSession.setActionHandler('seekbackward', (details) => {
          const skip = details.seekOffset || 10;
          seekTo(Math.max(0, (parseFloat(seekSlider.value) || 0) - skip));
        });
        navigator.mediaSession.setActionHandler('seekforward', (details) => {
          const skip = details.seekOffset || 10;
          seekTo((parseFloat(seekSlider.value) || 0) + skip);
        });
      } catch (_) {}
    }

    window.addEventListener('keydown', (e) => {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        seekTo(Math.max(0, (parseFloat(seekSlider.value) || 0) - 5));
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        seekTo((parseFloat(seekSlider.value) || 0) + 5);
      } else if (e.code === 'ArrowUp') {
        e.preventDefault();
        const v = Math.min(1, (parseFloat(volSlider.value) || 0) + 0.05);
        volSlider.value = v;
        volSlider.dispatchEvent(new Event('input'));
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        const v = Math.max(0, (parseFloat(volSlider.value) || 0) - 0.05);
        volSlider.value = v;
        volSlider.dispatchEvent(new Event('input'));
      } else if (e.code === 'KeyM') {
        e.preventDefault();
        btnMute.click();
      }
    });

    updateMediaSession();
  </script>
</body>
</html>
  </script>
